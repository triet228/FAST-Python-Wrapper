[project]
name = "fast-python-wrapper"
version = "0.1.0"
description = "Python wrapper for running FAST through MATLAB Engine."
readme = "README.md"

# Make sure Python version is compatible with MATLAB Engine
requires-python = "==3.11.*"
dependencies = [
    "matlabengine==26.1.12",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "core",
]
py-modules = [
    "main",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
